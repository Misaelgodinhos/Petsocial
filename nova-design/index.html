<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Design — Editor</title><style>
:root{font-family:Inter,system-ui,Arial;color:#222;background:#f4f5f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:1px solid #ddd;background:white;padding:9px 12px;border-radius:9px;cursor:pointer}button:hover{background:#f0edff}header{height:64px;background:#fff;display:flex;align-items:center;gap:9px;padding:10px 16px;border-bottom:1px solid #eee}header strong{font-size:20px;color:#6543c7}header input{border:1px solid #ddd;padding:10px;border-radius:8px;min-width:120px;flex:1;max-width:240px}.app{display:grid;grid-template-columns:230px 1fr 225px;height:calc(100dvh - 64px)}aside{background:#fff;padding:14px;overflow:auto;border-right:1px solid #e7e7e7}aside:last-child{border-right:0;border-left:1px solid #e7e7e7}h3{font-size:13px;color:#666;margin:14px 0 10px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tools button{font-size:13px}.workspace{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px;gap:12px}.page{width:600px;height:600px;background:white;box-shadow:0 8px 35px #2222;position:relative;overflow:hidden;transform-origin:top center;flex-shrink:0}.element{position:absolute;touch-action:none;cursor:move;white-space:pre-wrap;overflow:hidden;user-select:none}.element.selected{outline:2px solid #7755e8;outline-offset:2px}.element.selected:after{content:'';position:absolute;bottom:0;right:0;width:12px;height:12px;background:#7755e8;cursor:nwse-resize}.element img{width:100%;height:100%;object-fit:cover;pointer-events:none}.field{display:block;width:100%;margin:7px 0 12px;padding:8px;border:1px solid #ddd;border-radius:8px}label{font-size:12px;color:#555}#pages{display:flex;gap:8px;flex-wrap:wrap}#pages button.active{background:#7755e8;color:white}#status{font-size:12px;color:#666}#auth{display:none;position:fixed;inset:0;background:#0008;place-items:center;z-index:5}#auth .modal{background:#fff;padding:24px;border-radius:15px;width:min(90vw,380px)}#auth.open{display:grid}@media(max-width:850px){.app{grid-template-columns:1fr;height:auto}aside{border:0!important}.workspace{min-height:460px;overflow:auto;align-items:flex-start}.page{margin:auto}header{flex-wrap:wrap;height:auto}.tools{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><strong>◆ NOVA Design</strong><input id="title" value="Meu design" aria-label="Título do projeto"><button id="undo">↶</button><button id="redo">↷</button><button id="save">Salvar</button><button id="cloud">☁ Nuvem</button><button id="export">Exportar PNG</button></header><div class="app"><aside><h3>Adicionar</h3><div class="tools"><button id="text">Texto</button><button id="rect">Retângulo</button><button id="circle">Círculo</button><button id="image">Imagem</button><button id="duplicate">Duplicar</button><button id="delete">Excluir</button><button id="front">Frente</button><button id="back">Atrás</button></div><input id="upload" type="file" accept="image/*" hidden><h3>Templates</h3><div class="tools"><button data-template="poster">Cartaz</button><button data-template="quote">Frase</button></div><h3>Páginas</h3><div id="pages"></div><button id="addpage">+ Página</button><h3>Projetos locais</h3><button id="new">Novo</button><button id="open">Abrir salvo</button><h3>Arquivo</h3><button id="json">Baixar JSON</button><button id="import">Importar JSON</button><input id="importfile" type="file" accept=".json" hidden></aside><main class="workspace"><div id="status">Selecione um elemento para editar</div><div id="page" class="page"></div></main><aside><h3>Propriedades</h3><label>Texto</label><input class="field" id="value"><label>Cor</label><input class="field" type="color" id="color" value="#222222"><label>Tamanho da fonte</label><input class="field" type="number" id="font" value="32" min="8" max="200"><label>Posição X</label><input class="field" type="number" id="x"><label>Posição Y</label><input class="field" type="number" id="y"><label>Largura</label><input class="field" type="number" id="w"><label>Altura</label><input class="field" type="number" id="h"><label>Rotação (graus)</label><input class="field" type="number" id="rot"><label>Fundo da página</label><input class="field" type="color" id="background" value="#ffffff"><h3>Atalhos</h3><small>Delete: excluir · Ctrl+Z: desfazer · Ctrl+Y: refazer · Duplo clique: editar texto</small></aside></div><div id="auth"><div class="modal"><h2>Projetos na nuvem</h2><p>Entre para salvar seus projetos no Supabase.</p><input class="field" id="email" type="email" placeholder="E-mail"><input class="field" id="password" type="password" placeholder="Senha"><button id="login">Entrar</button><button id="signup">Cadastrar</button><button id="cloudsave">Salvar na nuvem</button><button id="cloudopen">Abrir da nuvem</button><button id="logout">Sair</button><button id="close">Fechar</button><p id="authstatus"></p></div></div><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const supabase=createClient('https://dthqzavxqoejqszsijqd.supabase.co','sb_publishable_rN1cirhfpFyxghxKx-gLTA_Ca0TP_Rn');
const $=id=>document.getElementById(id), page=$('page');let doc={title:'Meu design',pages:[{bg:'#ffffff',elements:[]}]},index=0,selected=null,history=[],future=[],cloudId=null;
const current=()=>doc.pages[index],uid=()=>crypto.randomUUID(),clone=v=>JSON.parse(JSON.stringify(v));
function snapshot(){history.push(clone(doc));if(history.length>60)history.shift();future=[]}
function add(type){snapshot();let e={id:uid(),type,x:80,y:90,w:230,h:type==='text'?80:150,rot:0,color:type==='rect'?'#7755e8':'#222222',font:36,text:type==='text'?'Seu texto aqui':'',src:''};if(type==='circle')e.color='#ffb86b';current().elements.push(e);selected=e.id;render()}
function active(){return current().elements.find(e=>e.id===selected)}
function render(){page.style.background=current().bg;page.replaceChildren();for(const e of current().elements){let el=document.createElement('div');el.className='element'+(e.id===selected?' selected':'');el.style.cssText='left:'+e.x+'px;top:'+e.y+'px;width:'+e.w+'px;height:'+e.h+'px;transform:rotate('+e.rot+'deg);';if(e.type==='text'){el.textContent=e.text;el.style.fontSize=e.font+'px';el.style.color=e.color}else if(e.type==='image'){let img=document.createElement('img');img.src=e.src;el.append(img)}else{el.style.background=e.color;el.style.borderRadius=e.type==='circle'?'50%':'0'}el.onpointerdown=ev=>{ev.stopPropagation();selected=e.id;render();let node=[...page.children].find(n=>n===el)||page.children[current().elements.indexOf(e)];if(!node)return;let startX=ev.clientX,startY=ev.clientY,ox=e.x,oy=e.y,ow=e.w,oh=e.h,resize=ev.offsetX>e.w-20&&ev.offsetY>e.h-20;snapshot();node.setPointerCapture?.(ev.pointerId);node.onpointermove=m=>{let dx=m.clientX-startX,dy=m.clientY-startY;if(resize){e.w=Math.max(20,ow+dx);e.h=Math.max(20,oh+dy)}else{e.x=ox+dx;e.y=oy+dy}node.style.left=e.x+'px';node.style.top=e.y+'px';node.style.width=e.w+'px';node.style.height=e.h+'px'};node.onpointerup=()=>{node.onpointermove=null;render()}};el.ondblclick=()=>{if(e.type==='text'){let v=prompt('Editar texto',e.text);if(v!==null){snapshot();e.text=v;render()}}};page.append(el)}$('title').value=doc.title;$('background').value=current().bg;let e=active();for(const id of ['value','color','font','x','y','w','h','rot'])$(id).disabled=!e;if(e){$('value').value=e.text||'';$('color').value=e.color;$('font').value=e.font;$('x').value=Math.round(e.x);$('y').value=Math.round(e.y);$('w').value=Math.round(e.w);$('h').value=Math.round(e.h);$('rot').value=e.rot} $('pages').replaceChildren();doc.pages.forEach((p,i)=>{let b=document.createElement('button');b.textContent=''+(i+1);b.className=i===index?'active':'';b.onclick=()=>{index=i;selected=null;render()};$('pages').append(b)});$('status').textContent='Página '+(index+1)+' de '+doc.pages.length+' · '+current().elements.length+' elementos'}
page.onclick=()=>{selected=null;render()};
for(const type of ['text','rect','circle'])$(type).onclick=()=>add(type);
$('image').onclick=()=>$('upload').click();$('upload').onchange=async ev=>{let file=ev.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{add('image');active().src=reader.result;render()};reader.readAsDataURL(file)};
for(const id of ['value','color','font','x','y','w','h','rot'])$(id).onchange=ev=>{let e=active();if(!e)return;snapshot();e[id==='value'?'text':id]=['value','color'].includes(id)?ev.target.value:Number(ev.target.value);render()};
$('background').onchange=e=>{snapshot();current().bg=e.target.value;render()};$('title').onchange=e=>{snapshot();doc.title=e.target.value;render()};
$('duplicate').onclick=()=>{let e=active();if(!e)return;snapshot();let copy=clone(e);copy.id=uid();copy.x+=20;copy.y+=20;current().elements.push(copy);selected=copy.id;render()};
$('delete').onclick=()=>{if(!active())return;snapshot();current().elements=current().elements.filter(e=>e.id!==selected);selected=null;render()};
$('front').onclick=()=>{let e=active();if(!e)return;snapshot();current().elements=current().elements.filter(v=>v!==e);current().elements.push(e);render()};
$('back').onclick=()=>{let e=active();if(!e)return;snapshot();current().elements=current().elements.filter(v=>v!==e);current().elements.unshift(e);render()};
$('undo').onclick=()=>{if(!history.length)return;future.push(clone(doc));doc=history.pop();selected=null;index=Math.min(index,doc.pages.length-1);render()};
$('redo').onclick=()=>{if(!future.length)return;history.push(clone(doc));doc=future.pop();selected=null;render()};
$('addpage').onclick=()=>{snapshot();doc.pages.push({bg:'#ffffff',elements:[]});index=doc.pages.length-1;selected=null;render()};
$('new').onclick=()=>{if(!confirm('Criar novo design?'))return;snapshot();doc={title:'Novo design',pages:[{bg:'#ffffff',elements:[]}]};index=0;selected=null;cloudId=null;render()};
$('save').onclick=()=>{localStorage.setItem('nova-design-project',JSON.stringify(doc));alert('Projeto salvo neste navegador')};
$('open').onclick=()=>{let s=localStorage.getItem('nova-design-project');if(!s)return alert('Nenhum projeto salvo');doc=JSON.parse(s);index=0;selected=null;render()};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('json').onclick=()=>download(new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),'nova-design.json');
$('import').onclick=()=>$('importfile').click();$('importfile').onchange=async ev=>{try{let data=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(data.pages))throw Error('Formato inválido');doc=data;index=0;selected=null;render()}catch(e){alert(e.message)}};
document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{snapshot();current().elements=[];if(b.dataset.template==='poster'){current().bg='#f7eaff';add('rect');let e=active();e.x=0;e.y=0;e.w=600;e.h=180;e.color='#7755e8';add('text');e=active();e.x=40;e.y=240;e.w=520;e.text='SEU EVENTO';e.font=58}else{current().bg='#fff4e8';add('text');let e=active();e.x=70;e.y=180;e.w=460;e.h=200;e.text='Crie algo incrível';e.font=54}render()});
$('export').onclick=async()=>{let canvas=document.createElement('canvas');canvas.width=600;canvas.height=600;let ctx=canvas.getContext('2d');ctx.fillStyle=current().bg;ctx.fillRect(0,0,600,600);for(let e of current().elements){ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.rotate(e.rot*Math.PI/180);if(e.type==='text'){ctx.fillStyle=e.color;ctx.font=e.font+'px Arial';e.text.split('\n').forEach((line,i)=>ctx.fillText(line,-e.w/2,-e.h/2+e.font*(i+1),e.w))}else if(e.type==='image'){let img=new Image();img.src=e.src;await img.decode().catch(()=>{});if(img.naturalWidth)ctx.drawImage(img,-e.w/2,-e.h/2,e.w,e.h)}else{ctx.fillStyle=e.color;ctx.beginPath();if(e.type==='circle')ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);else ctx.rect(-e.w/2,-e.h/2,e.w,e.h);ctx.fill()}ctx.restore()}canvas.toBlob(b=>b&&download(b,'nova-design.png'))};
document.onkeydown=e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='Delete')$('delete').click();if(e.ctrlKey&&e.key.toLowerCase()==='z'){$('undo').click();e.preventDefault()}if(e.ctrlKey&&e.key.toLowerCase()==='y'){$('redo').click();e.preventDefault()}};
$('cloud').onclick=()=>$('auth').classList.add('open');$('close').onclick=()=>$('auth').classList.remove('open');const message=t=>$('authstatus').textContent=t;
$('login').onclick=async()=>{let {error}=await supabase.auth.signInWithPassword({email:$('email').value,password:$('password').value});message(error?.message||'Conectado')};
$('signup').onclick=async()=>{let {error}=await supabase.auth.signUp({email:$('email').value,password:$('password').value});message(error?.message||'Conta criada. Confirme o e-mail, se solicitado.')};
$('logout').onclick=async()=>{await supabase.auth.signOut();message('Sessão encerrada')};
$('cloudsave').onclick=async()=>{let {data:{user}}=await supabase.auth.getUser();if(!user)return message('Entre na sua conta primeiro');let payload={title:doc.title,document:doc,user_id:user.id};let q=cloudId?supabase.from('design_projects').update(payload).eq('id',cloudId).select('id').single():supabase.from('design_projects').insert(payload).select('id').single();let {data,error}=await q;if(error)return message(error.message);cloudId=data.id;message('Salvo na nuvem')};
$('cloudopen').onclick=async()=>{let {data,error}=await supabase.from('design_projects').select('id,title,document').order('updated_at',{ascending:false}).limit(20);if(error)return message(error.message);if(!data.length)return message('Nenhum projeto na nuvem');let choice=prompt('Escolha o número do projeto:\n'+data.map((p,i)=>(i+1)+'. '+p.title).join('\n'));let p=data[Number(choice)-1];if(!p)return;doc=p.document;cloudId=p.id;index=0;selected=null;render();$('auth').classList.remove('open')};
render();
</script></body></html>
