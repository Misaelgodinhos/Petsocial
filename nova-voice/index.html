<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>NOVA Voice 1.0</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 40%,#17213b 0,#080b13 58%);color:#f5f7ff;font-family:Inter,system-ui,Arial;min-height:100dvh}main{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:22px 18px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;letter-spacing:.23em;font-weight:750}.brand span{color:#8ab8ff}.status{font-size:12px;color:#9caac4}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;min-height:270px}.orb{width:min(48vw,210px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#d5f8ff 0,#80b8ff 17%,#6555e5 48%,#151f56 73%);box-shadow:0 0 45px #5a79f566,0 0 110px #4a7bfa33,inset -15px -20px 38px #0c154c;transition:transform .25s,filter .25s;animation:float 4s ease-in-out infinite}.orb.listening{animation:pulse 1s ease-in-out infinite;filter:brightness(1.35)}.orb.speaking{animation:pulse .65s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}@keyframes pulse{50%{transform:scale(1.09)}}h1{font-size:clamp(25px,6vw,38px);margin:0;font-weight:600;letter-spacing:-.04em;text-align:center}.hint{text-align:center;color:#9caac4;font-size:14px;margin:0}.chat{max-height:26dvh;min-height:100px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0;scrollbar-width:thin}.msg{max-width:88%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.5;background:#1a2234;align-self:flex-start;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#304b8d}.controls{display:flex;gap:10px;align-items:center;padding-top:16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}.input{flex:1;min-width:0;border:1px solid #34405c;background:#141b2b;border-radius:16px;color:white;padding:16px;font:inherit;outline:none}.input:focus{border-color:#80b8ff}button{border:0;color:white;background:#263550;border-radius:15px;padding:15px;cursor:pointer;font:inherit}button.primary{background:#6689ed;color:#081126;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.actions button{font-size:13px;padding:10px 14px;background:#192238}.foot{color:#72809d;text-align:center;font-size:11px;margin-top:7px}@media(max-height:650px){.center{min-height:160px;gap:12px}.orb{width:110px}.chat{max-height:24dvh}main{padding-top:12px}}</style></head>
<body><main><header class="top"><div class="brand">NOVA <span>VOICE</span></div><div class="status" id="status">● Pronto</div></header><section class="center"><div class="orb" id="orb" aria-hidden="true"></div><div><h1 id="heading">Como posso ajudar?</h1><p class="hint" id="hint">Toque no microfone para ativar a escuta contínua</p></div><div class="actions"><button data-command="Que horas são?">Que horas são?</button><button data-command="Qual é a data de hoje?">Data de hoje</button><button data-command="Me conte uma curiosidade">Curiosidade</button></div></section><section class="chat" id="chat" aria-live="polite"><div class="msg">Olá! Eu sou a NOVA. Posso conversar por voz, informar a hora e a data e guardar seu histórico neste dispositivo.</div></section><form class="controls" id="form"><input class="input" id="input" autocomplete="off" placeholder="Fale ou escreva para a NOVA…" aria-label="Mensagem"><button type="button" id="mic" aria-label="Iniciar reconhecimento de voz">🎙</button><button type="submit" class="primary" aria-label="Enviar mensagem">➤</button></form><div class="foot">NOVA Voice 1.1 · Escuta contínua enquanto a página estiver ativa · Sem conexão com modelo de IA</div></main>
<script>
const $=id=>document.getElementById(id),chat=$('chat'),orb=$('orb'),status=$('status');let recognition=null,listening=false;const historyKey='nova_voice_history_v1';
function add(text,role='assistant',save=true){let el=document.createElement('div');el.className='msg'+(role==='user'?' user':'');el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;if(save){let a=JSON.parse(localStorage.getItem(historyKey)||'[]');a.push({text,role});localStorage.setItem(historyKey,JSON.stringify(a.slice(-80)));}}
try{JSON.parse(localStorage.getItem(historyKey)||'[]').forEach(m=>add(m.text,m.role,false))}catch{}
function setMode(mode){orb.classList.toggle('listening',mode==='listening');orb.classList.toggle('speaking',mode==='speaking');status.textContent=mode==='listening'?'● Ouvindo':mode==='speaking'?'● Falando':'● Pronto';$('heading').textContent=mode==='listening'?'Estou ouvindo…':mode==='speaking'?'NOVA está respondendo':'Como posso ajudar?';}
function speak(text){if(!('speechSynthesis'in window)){resumeListening();return;}speaking=true;clearTimeout(restartTimer);if(listening){try{recognition.stop()}catch{}}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=1;u.onstart=()=>setMode('speaking');const done=()=>{speaking=false;setMode('ready');resumeListening()};u.onend=done;u.onerror=done;window.speechSynthesis.speak(u)}
function answer(s){let q=s.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(/(hora|horario)/.test(q))return 'Agora são '+new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'.';if(/(data|dia de hoje|que dia)/.test(q))return 'Hoje é '+new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())+'.';if(/(oi|ola|bom dia|boa tarde|boa noite)/.test(q))return 'Olá! Estou pronta para ajudar. O que você gostaria de fazer?';if(/(seu nome|quem e voce)/.test(q))return 'Sou a NOVA Voice, sua assistente por voz.';if(/(curiosidade)/.test(q))return 'Você sabia que a luz do Sol leva aproximadamente oito minutos para chegar à Terra?';if(/(obrigad|valeu)/.test(q))return 'Por nada!';if(/(pare de falar|silencio|calar)/.test(q)){window.speechSynthesis?.cancel();return 'Tudo bem, vou parar de falar.';}return 'Entendi: '+s+'. Nesta primeira versão eu respondo a comandos básicos. Para conversas abertas, será necessário conectar um modelo de inteligência artificial.';}
function send(s){s=s.trim();if(!s)return;add(s,'user');$('input').value='';const r=answer(s);add(r);speak(r)}
$('form').addEventListener('submit',e=>{e.preventDefault();send($('input').value)});document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send(b.dataset.command));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let alwaysListening=false,speaking=false,restartTimer=null,blocked=false;
function updateMic(){const b=$('mic');b.textContent=alwaysListening?'⏸':'🎙';b.setAttribute('aria-label',alwaysListening?'Pausar escuta contínua':'Ativar escuta contínua');$('hint').textContent=alwaysListening?'Escuta contínua ativada · Toque em ⏸ para pausar':'Toque no microfone para ativar a escuta contínua';}
function resumeListening(){clearTimeout(restartTimer);if(!alwaysListening||speaking||blocked||!recognition||document.hidden)return;restartTimer=setTimeout(()=>{if(!alwaysListening||speaking||listening||document.hidden)return;try{recognition.start()}catch(e){restartTimer=setTimeout(resumeListening,1200)}},350)}
if(SR){
 recognition=new SR();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=false;
 recognition.onstart=()=>{listening=true;if(!speaking)setMode('listening')};
 recognition.onresult=e=>{if(!alwaysListening||speaking)return;const t=e.results[e.resultIndex][0].transcript;if(t&&t.trim())send(t)};
 recognition.onend=()=>{listening=false;if(!speaking){setMode('ready');resumeListening()}};
 recognition.onerror=e=>{listening=false;if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){blocked=true;alwaysListening=false;updateMic();add('A escuta foi interrompida: '+e.error+'. Verifique a permissão do microfone e ative novamente.','assistant',false)}else if(e.error!=='no-speech'&&e.error!=='aborted'){add('Reconhecimento de voz: '+e.error+'. Tentarei novamente.','assistant',false)}};
}else{$('mic').title='Reconhecimento de voz indisponível neste navegador';$('mic').disabled=true;$('hint').textContent='Seu navegador não oferece reconhecimento de voz. Você ainda pode digitar.'}
$('mic').onclick=()=>{if(!recognition)return;alwaysListening=!alwaysListening;blocked=false;updateMic();if(alwaysListening){window.speechSynthesis?.cancel();speaking=false;resumeListening()}else{clearTimeout(restartTimer);if(listening)try{recognition.stop()}catch{};setMode('ready')}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeListening();else clearTimeout(restartTimer)});
updateMic();
</script></body></html>
