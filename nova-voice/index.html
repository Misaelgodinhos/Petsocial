<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a13"><title>NOVA Voice — Assistente por voz</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% 46%,#19274a 0%,#0b1021 43%,#060911 90%);color:#f6f8ff;font-family:Inter,system-ui,-apple-system,Arial,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(22px,5vh,44px) 18px max(28px,env(safe-area-inset-bottom));text-align:center;cursor:pointer;user-select:none;touch-action:manipulation}.brand{font-size:clamp(16px,3vw,22px);font-weight:750;letter-spacing:.34em}.brand span{color:#93b9ff}.stage{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:clamp(35px,7vh,80px);width:100%}.orb{width:min(57vw,32vh,310px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 28%,#d5f9ff 0%,#91cbff 15%,#6d7cf3 42%,#4033a8 66%,#0e1a4c 93%);box-shadow:0 0 42px #668aff6a,0 0 120px #5278f84a,inset -18px -22px 44px #07133e;animation:float 4s ease-in-out infinite;transition:filter .25s}.orb.listening{animation:breathe 1.6s ease-in-out infinite;filter:brightness(1.2)}.orb.speaking{animation:breathe .7s ease-in-out infinite;filter:brightness(1.45)}@keyframes float{50%{transform:translateY(-12px)}}@keyframes breathe{50%{transform:scale(1.09);box-shadow:0 0 90px #83b4ff99,0 0 160px #5278f866}}.state{font-size:clamp(24px,5vw,36px);font-weight:600;letter-spacing:-.035em;margin:0}.detail{color:#aab6d2;font-size:clamp(13px,2.5vw,16px);line-height:1.6;margin:10px auto 0;max-width:460px;min-height:24px}.footer{font-size:12px;color:#8391b0;line-height:1.7}.caption{font-size:13px;color:#c6d5f4;min-height:20px;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:14px}@media(max-height:500px){.stage{gap:12px}.orb{width:min(26vh,170px)}main{padding:14px}.footer{font-size:10px}}</style></head><body><main id="surface" role="button" tabindex="0" aria-label="Toque para ativar ou pausar o assistente por voz"><header class="brand">NOVA <span>VOICE</span></header><section class="stage"><div id="orb" class="orb" aria-hidden="true"></div><div><h1 id="state" class="state">NOVA Voice</h1><p id="detail" class="detail">Toque em qualquer lugar para iniciar a conversa</p><div id="caption" class="caption" aria-live="polite"></div></div></section><footer class="footer">NOVA Voice 2.0 · Assistente por voz<br>Toque na tela para pausar ou retomar</footer></main><script>
const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,active=false,hearing=false,talking=false,blocked=false,restart=null,captionTimer=null,navTimer=null;
function ui(mode,detail){$('orb').className='orb '+(mode==='listening'?'listening':mode==='speaking'?'speaking':'');$('state').textContent=mode==='listening'?'Estou ouvindo':mode==='speaking'?'NOVA está falando':mode==='processing'?'Processando':active?'Escuta pausada':'NOVA Voice';$('detail').textContent=detail||(mode==='listening'?'Pode falar naturalmente':active?'Toque para retomar':'Toque em qualquer lugar para iniciar a conversa')}
function caption(s){$('caption').textContent=s;clearTimeout(captionTimer);captionTimer=setTimeout(()=>$('caption').textContent='',4500)}
function resume(){clearTimeout(restart);if(!active||talking||blocked||hearing||document.hidden||!rec)return;restart=setTimeout(()=>{if(!active||talking||hearing||document.hidden)return;try{rec.start()}catch{restart=setTimeout(resume,1100)}},450)}
function say(s){caption(s);if(!window.speechSynthesis){resume();return}talking=true;clearTimeout(restart);if(hearing)try{rec.stop()}catch{};speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='pt-BR';u.rate=1;u.onstart=()=>ui('speaking');let finished=false;function done(){if(finished)return;finished=true;talking=false;if(active)resume();else ui('paused','Toque para retomar')}u.onend=done;u.onerror=done;speechSynthesis.speak(u);setTimeout(()=>{if(talking&&active&&speechSynthesis.speaking===false)done()},2500)}
function normalize(s){return s.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function respond(s){const q=normalize(s);if(/\b(horas|hora|horario)\b/.test(q))return 'Agora são '+new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'.';if(/\b(data|dia de hoje|que dia)\b/.test(q))return 'Hoje é '+new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())+'.';if(/\b(oi|ola|bom dia|boa tarde|boa noite)\b/.test(q))return 'Olá! Estou ouvindo. Como posso ajudar?';if(/(seu nome|quem e voce)/.test(q))return 'Eu sou a NOVA Voice, sua assistente de voz.';if(/curiosidade/.test(q))return 'Uma curiosidade: a luz do Sol leva cerca de oito minutos para chegar à Terra.';if(/(obrigad|valeu)/.test(q))return 'Por nada!';if(/(abrir|abra|acesse) (o |a )?(youtube|google|wikipedia)/.test(q)){const site=q.match(/(youtube|google|wikipedia)/)[1];const urls={youtube:'https://www.youtube.com/',google:'https://www.google.com/',wikipedia:'https://pt.wikipedia.org/'};say('Vou abrir '+site+'.');navTimer=setTimeout(()=>{if(active)location.assign(urls[site])},1600);return null}if(/(pare de ouvir|desativar escuta|pausar escuta)/.test(q)){active=false;clearTimeout(restart);return 'Escuta pausada. Toque na tela para voltar.'}return 'Ainda estou aprendendo a realizar esse pedido. Esta versão funciona com comandos básicos e não está conectada a um modelo de inteligência artificial.'}
function heard(s){if(!active||talking)return;caption('Você: '+s);ui('processing','');const reply=respond(s);if(reply!==null)say(reply)}
if(SR){rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{hearing=true;if(!talking)ui('listening')};rec.onresult=e=>{if(!active||talking)return;const t=e.results[e.resultIndex]?.[0]?.transcript;if(t?.trim())heard(t.trim())};rec.onend=()=>{hearing=false;if(active&&!talking)resume();else if(!active)ui('paused','Toque para retomar')};rec.onerror=e=>{hearing=false;if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){active=false;blocked=true;ui('paused','Permita o microfone nas configurações do navegador e toque novamente')}else if(e.error!=='no-speech'&&e.error!=='aborted'){caption('Falha de reconhecimento: '+e.error)}}}else{ui('paused','Este navegador não oferece reconhecimento de voz. Experimente o Chrome para Android.')}
function toggle(){if(!rec)return;clearTimeout(navTimer);active=!active;blocked=false;if(active){speechSynthesis?.cancel();talking=false;ui('processing','Ativando microfone…');resume()}else{clearTimeout(restart);speechSynthesis?.cancel();talking=false;if(hearing)try{rec.stop()}catch{};ui('paused','Toque para retomar')}}
$('surface').addEventListener('click',toggle);$('surface').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(restart);else resume()});
</script></body></html>
