<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9faff"><title>NOVA Voice — Assistente de IA</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow:hidden}body{font-family:Inter,system-ui,-apple-system,Arial,sans-serif;color:#0c193c;background:radial-gradient(circle at 50% 38%,#f0f4ff 0%,#fff 65%)}main{min-height:100dvh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(18px,3vh,30px) 18px max(24px,env(safe-area-inset-bottom));text-align:center;cursor:pointer;user-select:none;overflow:hidden}.brand{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}.logo{font-size:clamp(42px,7vh,65px);font-weight:900;line-height:1;letter-spacing:-.12em;padding-right:.12em;background:linear-gradient(135deg,#00bdf5,#3e5eff 50%,#a55af6);background-clip:text;-webkit-background-clip:text;color:transparent}.brandname{font-size:clamp(23px,4.5vw,35px);letter-spacing:-.045em;font-weight:750}.brandname span{font-weight:350}.subtitle{color:#7d879e;font-size:clamp(11px,2.7vw,15px);margin:0}.stage{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(15px,4vh,40px)}.orb-wrap{position:relative;width:min(74vw,38vh,330px);aspect-ratio:1;display:grid;place-items:center;filter:drop-shadow(0 14px 28px #728aff33)}.petal{position:absolute;inset:9%;border-radius:44% 56% 52% 48% / 50% 42% 58% 50%;background:linear-gradient(135deg,#35c9ff70,#4869ff77 52%,#dc80ef70);animation:turn 13s linear infinite}.petal:nth-child(2){transform:rotate(55deg);animation:turn2 11s linear infinite;background:linear-gradient(55deg,#48d8ff80,#6752ee70,#d78bfa7a)}.petal:nth-child(3){transform:rotate(110deg);animation:turn3 15s linear infinite;background:linear-gradient(145deg,#62baff80,#3c55e97a,#edb6f980)}.orb{position:relative;z-index:1;width:68%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#0ebbf4,#3d63f0 48%,#9854ec);box-shadow:inset 0 10px 32px #ffffff30,0 0 28px #6489f366;display:grid;place-items:center;transition:filter .25s}.orb:after{content:'';width:34%;height:30%;background:repeating-linear-gradient(90deg,transparent 0 9%,white 9% 17%,transparent 17% 26%);mask-image:radial-gradient(ellipse,black 62%,transparent 72%);border-radius:50%;opacity:.9}.orb.listening{filter:brightness(1.12);animation:pulse 1.2s ease-in-out infinite}.orb.speaking{animation:pulse .6s ease-in-out infinite}.orb.listening:after,.orb.speaking:after{animation:pulse .6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.09)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes turn2{to{transform:rotate(415deg)}}@keyframes turn3{to{transform:rotate(-250deg)}}.state{font-size:clamp(25px,5vw,38px);font-weight:550;letter-spacing:-.045em;margin:0}.detail{color:#7d879e;font-size:clamp(12px,2.6vw,15px);margin:9px auto 0;max-width:400px;line-height:1.5;min-height:18px}.caption{font-size:12px;color:#56678d;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:12px;min-height:18px}.footer{width:calc(100% + 36px);margin:0 -18px -12px;position:relative;flex-shrink:0;padding:clamp(32px,6vh,55px) 15px 4px;color:#697ba7;font-size:12px;line-height:1.5;isolation:isolate}.footer:before,.footer:after{content:'';position:absolute;z-index:-1;left:-10%;width:120%;height:100%;top:0;border-radius:48% 52% 0 0 / 35% 40% 0 0;background:linear-gradient(100deg,#b4e4ff90,#b2c4ff90,#d3a8fb90);transform:rotate(-3deg)}.footer:after{opacity:.5;transform:rotate(4deg) translateY(14px)}.mic-disc{width:clamp(55px,9vh,78px);height:clamp(55px,9vh,78px);border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#e9efff 70%);box-shadow:0 6px 25px #526cdd55,0 0 0 7px #ffffff77;display:grid;place-items:center;margin:-15px auto 15px;color:#172b61}.mic-disc svg{width:35%;height:35%}@media(max-height:600px){.stage{gap:8px}.orb-wrap{width:min(40vw,30vh)}.brand{gap:3px}.footer{padding-top:15px}.mic-disc{margin:0 auto 8px}.subtitle{font-size:11px}}
.settings-toggle{position:fixed;top:20px;right:20px;z-index:10;border:0;background:#eef2ff;color:#16224a;border-radius:50%;width:44px;height:44px;font-size:23px;cursor:pointer}.settings{position:fixed;z-index:20;inset:0;background:#0d173c55;display:grid;place-items:center;padding:18px}.settings[hidden]{display:none}.settings-panel{width:min(100%,400px);background:#fff;border-radius:24px;padding:24px;text-align:left;box-shadow:0 20px 70px #12245844}.settings-panel h2{margin:0 0 8px}.settings-panel p{font-size:13px;color:#6b7897}.settings-panel label{display:block;margin:18px 0 8px;font-size:14px}.settings-panel select,.settings-panel input{width:100%;padding:12px;border:1px solid #cbd5ec;border-radius:12px;background:white;color:#14224a}.settings-actions{display:flex;gap:10px;margin-top:22px}.settings-actions button{flex:1;border:0;border-radius:12px;padding:13px;background:#e9efff;color:#15275c;font-weight:600}.settings-actions button:last-child{background:#4368e9;color:white}</style></head><body><button id="settingsBtn" class="settings-toggle" aria-label="Configurações de voz" title="Configurações de voz">⚙</button><div id="settings" class="settings" hidden><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><h2 id="settingsTitle">Voz da NOVA</h2><p>Escolha uma voz instalada no seu dispositivo. O estilo futurista usa ajustes de tom e velocidade.</p><label for="voiceSelect">Voz disponível</label><select id="voiceSelect"><option value="">Automática (português)</option></select><label for="voiceStyle">Estilo</label><select id="voiceStyle"><option value="futuristic">Futurista (inspirado em assistentes de ficção)</option><option value="natural">Natural</option><option value="soft">Suave</option></select><label for="voiceRate">Velocidade: <span id="rateValue">1.0x</span></label><input id="voiceRate" type="range" min="0.7" max="1.3" step="0.1" value="1"><div class="settings-actions"><button id="testVoice" type="button">Testar voz</button><button id="closeSettings" type="button">Salvar e fechar</button></div></section></div><main id="surface" role="button" tabindex="0" aria-label="Toque para ativar ou pausar o assistente por voz"><header class="brand"><div class="logo">N</div><div class="brandname">NOVA <span>Voice</span></div><p class="subtitle">Assistente de Inteligência Artificial</p></header><section class="stage"><div class="orb-wrap"><div class="petal"></div><div class="petal"></div><div class="petal"></div><div id="orb" class="orb" aria-hidden="true"></div></div><div><h1 id="state" class="state">NOVA Voice</h1><p id="detail" class="detail">Toque na tela para começar a conversar</p><div id="caption" class="caption" aria-live="polite"></div></div></section><footer class="footer"><div class="mic-disc" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></div>Toque em qualquer lugar para ativar ou pausar a escuta</footer></main><script>
const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,active=false,hearing=false,talking=false,blocked=false,restart=null,captionTimer=null,navTimer=null;
function ui(mode,detail){$('orb').className='orb '+(mode==='listening'?'listening':mode==='speaking'?'speaking':'');$('state').textContent=mode==='listening'?'Pode falar...':mode==='speaking'?'Estou respondendo...':mode==='processing'?'Um momento...':active?'Escuta pausada':'Pode falar...';$('detail').textContent=detail||(mode==='listening'?'Estou ouvindo você':mode==='speaking'?'Respondendo por voz':active?'Escuta ativada':'Toque na tela para começar');$('surface').setAttribute('aria-pressed',String(active))}
function caption(s){$('caption').textContent=s;clearTimeout(captionTimer);captionTimer=setTimeout(()=>$('caption').textContent='',4500)}
function resume(){clearTimeout(restart);if(!active||talking||blocked||hearing||document.hidden||!rec)return;restart=setTimeout(()=>{if(!active||talking||hearing||document.hidden)return;try{rec.start()}catch{restart=setTimeout(resume,1100)}},450)}
const voiceKey='nova_voice_settings_v1';let voicePrefs={voice:'',style:'futuristic',rate:1};try{voicePrefs={...voicePrefs,...JSON.parse(localStorage.getItem(voiceKey)||'{}')}}catch{}
function availableVoices(){return window.speechSynthesis?.getVoices()||[]}
function selectedVoice(){const v=availableVoices();return v.find(x=>x.voiceURI===voicePrefs.voice)||v.find(x=>x.lang.toLowerCase()==='pt-br')||v.find(x=>x.lang.toLowerCase().startsWith('pt'))||null}
function say(s,preview=false){caption(s);if(!window.speechSynthesis){if(!preview)resume();return}talking=true;clearTimeout(restart);if(hearing)try{rec.stop()}catch{};speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);const v=selectedVoice();if(v)u.voice=v;u.lang=v?.lang||'pt-BR';u.rate=Number(voicePrefs.rate)||1;u.pitch=voicePrefs.style==='futuristic'?0.78:voicePrefs.style==='soft'?1.12:1;u.onstart=()=>ui('speaking');let finished=false;function done(){if(finished)return;finished=true;talking=false;if(active&&!preview)resume();else if(active&&preview)resume();else ui('paused','Toque na tela para retomar')}u.onend=done;u.onerror=done;speechSynthesis.speak(u)}
function populateVoices(){const el=$('voiceSelect');const voices=availableVoices().filter(v=>v.lang.toLowerCase().startsWith('pt'));el.replaceChildren();const opt=document.createElement('option');opt.value='';opt.textContent='Automática (português)';el.appendChild(opt);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' — '+v.lang;el.appendChild(o)});el.value=voices.some(v=>v.voiceURI===voicePrefs.voice)?voicePrefs.voice:''}
if(window.speechSynthesis){speechSynthesis.addEventListener?.('voiceschanged',populateVoices);populateVoices()}
$('voiceStyle').value=voicePrefs.style;$('voiceRate').value=voicePrefs.rate;$('rateValue').textContent=Number(voicePrefs.rate).toFixed(1)+'x';
function saveVoice(){voicePrefs={voice:$('voiceSelect').value,style:$('voiceStyle').value,rate:Number($('voiceRate').value)};localStorage.setItem(voiceKey,JSON.stringify(voicePrefs))}
$('voiceRate').addEventListener('input',()=>{$('rateValue').textContent=Number($('voiceRate').value).toFixed(1)+'x';saveVoice()});$('voiceSelect').addEventListener('change',saveVoice);$('voiceStyle').addEventListener('change',saveVoice);
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();$('settings').hidden=false;populateVoices()});
$('settings').addEventListener('click',e=>{e.stopPropagation();if(e.target===$('settings'))$('settings').hidden=true});
$('closeSettings').addEventListener('click',e=>{e.stopPropagation();saveVoice();$('settings').hidden=true});
$('testVoice').addEventListener('click',e=>{e.stopPropagation();saveVoice();say('Olá! Eu sou a NOVA Voice. Esta é a minha nova voz, pronta para ajudar você.',true)});
function normalize(s){return s.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function respond(s){const q=normalize(s);if(/\b(horas|hora|horario)\b/.test(q))return 'Agora são '+new Intl.DateTimeFormat('pt-BR',{hour:'2-digit',minute:'2-digit'}).format(new Date())+'.';if(/\b(data|dia de hoje|que dia)\b/.test(q))return 'Hoje é '+new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(new Date())+'.';if(/\b(oi|ola|bom dia|boa tarde|boa noite)\b/.test(q))return 'Olá! Estou ouvindo. Como posso ajudar?';if(/(seu nome|quem e voce)/.test(q))return 'Eu sou a NOVA Voice, sua assistente de voz.';if(/curiosidade/.test(q))return 'Uma curiosidade: a luz do Sol leva cerca de oito minutos para chegar à Terra.';if(/(obrigad|valeu)/.test(q))return 'Por nada!';if(/(abrir|abra|acesse) (o |a )?(youtube|google|wikipedia)/.test(q)){const site=q.match(/(youtube|google|wikipedia)/)[1];const urls={youtube:'https://www.youtube.com/',google:'https://www.google.com/',wikipedia:'https://pt.wikipedia.org/'};say('Vou abrir '+site+'.');navTimer=setTimeout(()=>{if(active)location.assign(urls[site])},1600);return null}if(/(pare de ouvir|desativar escuta|pausar escuta)/.test(q)){active=false;clearTimeout(restart);return 'Escuta pausada. Toque na tela para voltar.'}return 'Ainda estou aprendendo a realizar esse pedido. Esta versão funciona com comandos básicos e não está conectada a um modelo de inteligência artificial.'}
function heard(s){if(!active||talking)return;caption('Você: '+s);ui('processing','');const reply=respond(s);if(reply!==null)say(reply)}
if(SR){rec=new SR();rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;rec.onstart=()=>{hearing=true;if(!talking)ui('listening')};rec.onresult=e=>{if(!active||talking)return;const t=e.results[e.resultIndex]?.[0]?.transcript;if(t?.trim())heard(t.trim())};rec.onend=()=>{hearing=false;if(active&&!talking)resume();else if(!active)ui('paused','Toque para retomar')};rec.onerror=e=>{hearing=false;if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){active=false;blocked=true;ui('paused','Permita o microfone nas configurações do navegador e toque novamente')}else if(e.error!=='no-speech'&&e.error!=='aborted'){caption('Falha de reconhecimento: '+e.error)}}}else{ui('paused','Este navegador não oferece reconhecimento de voz. Experimente o Chrome para Android.')}
function toggle(){if(!rec){ui('paused','Reconhecimento de voz indisponível neste navegador');return}clearTimeout(navTimer);active=!active;blocked=false;if(active){speechSynthesis?.cancel();talking=false;ui('processing','Ativando microfone…');try{if(!hearing)rec.start();else ui('listening')}catch{resume()}}else{clearTimeout(restart);speechSynthesis?.cancel();talking=false;if(hearing)try{rec.stop()}catch{};ui('paused','Toque na tela para retomar')}}
$('surface').addEventListener('click',toggle);$('surface').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(restart);else resume()});</script></body></html>
