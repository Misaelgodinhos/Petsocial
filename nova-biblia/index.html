<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA Bíblia</title><style>
:root{font-family:Georgia,serif;color:#352e28;background:#f7f3ec}*{box-sizing:border-box}body{margin:0}header{background:#fffdf9;border-bottom:1px solid #e7dfd4;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:23px;margin:0}button,select,input,textarea{font:inherit;border:1px solid #d8ccbc;background:#fffdf9;color:#352e28;border-radius:9px;padding:10px}button{cursor:pointer}button:hover{background:#eee4d6}main{max-width:980px;margin:28px auto;padding:0 16px;display:grid;grid-template-columns:250px 1fr;gap:20px}aside,article{background:#fffdf9;border:1px solid #e7dfd4;border-radius:16px;padding:22px}aside{max-height:75vh;overflow:auto}aside button{display:block;width:100%;margin:4px 0;text-align:left}article{min-height:65vh}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}h2{font-weight:normal;font-size:30px}#verses p{line-height:1.85}small{color:#8b7763}#search{width:100%;margin-bottom:12px}#notes{width:100%;min-height:90px}#results button{display:block;width:100%;text-align:left;margin-bottom:6px}.muted{color:#87796b}.dark{background:#211e1b;color:#eee5d8}.dark header,.dark aside,.dark article,.dark button,.dark select,.dark input,.dark textarea{background:#302b26;color:#eee5d8;border-color:#5b5044}@media(max-width:650px){main{grid-template-columns:1fr;margin:10px auto}aside{max-height:200px}header{flex-wrap:wrap}article{padding:16px}}
</style><link rel="stylesheet" href="cordeirinho.css?v=1"><link rel="stylesheet" href="v5.css?v=5.0"></head><body><header><h1>✦ NOVA Bíblia</h1><button id="theme">☾ Tema</button></header><main><aside><input id="search" placeholder="Pesquisar livros ou textos"><div id="results"></div><h3>Livros</h3><div id="books"></div></aside><article><div class="toolbar"><select id="chapter"></select><button id="prev">← Anterior</button><button id="next">Próximo →</button><button id="smaller">A−</button><button id="larger">A+</button><button id="fav">☆ Favorito</button></div><h2 id="heading"></h2><div id="verses"></div><h3>Anotações</h3><textarea id="notes" placeholder="Suas anotações são salvas neste navegador"></textarea><h3>Favoritos</h3><div id="favorites"></div><p class="muted"><small>Versão inicial: inclui livros e capítulos para navegação e trechos demonstrativos em paráfrase. Para disponibilizar o texto bíblico integral, integre uma tradução com licença apropriada.</small></p></article></main><script>
const names="Gênesis|Êxodo|Levítico|Números|Deuteronômio|Josué|Juízes|Rute|1 Samuel|2 Samuel|1 Reis|2 Reis|1 Crônicas|2 Crônicas|Esdras|Neemias|Ester|Jó|Salmos|Provérbios|Eclesiastes|Cânticos|Isaías|Jeremias|Lamentações|Ezequiel|Daniel|Oseias|Joel|Amós|Obadias|Jonas|Miqueias|Naum|Habacuque|Sofonias|Ageu|Zacarias|Malaquias|Mateus|Marcos|Lucas|João|Atos|Romanos|1 Coríntios|2 Coríntios|Gálatas|Efésios|Filipenses|Colossenses|1 Tessalonicenses|2 Tessalonicenses|1 Timóteo|2 Timóteo|Tito|Filemom|Hebreus|Tiago|1 Pedro|2 Pedro|1 João|2 João|3 João|Judas|Apocalipse".split("|");
const counts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
const demo={"Gênesis:1":["No princípio, Deus criou os céus e a terra.","Deus ordenou que houvesse luz, e a luz surgiu.","Deus viu que a luz era boa e a separou das trevas."],"Salmos:23":["O Senhor cuida de mim como um pastor; nada me faltará.","Ele me conduz ao descanso e renova minhas forças.","Mesmo em momentos difíceis, sua presença me conforta."],"João:3":["Jesus ensinou sobre a necessidade de nascer de novo.","Deus amou o mundo e ofereceu seu Filho para que quem nele crê tenha vida eterna."]};
let book=Number(localStorage.getItem("nova_book")||0),ch=Number(localStorage.getItem("nova_ch")||1),size=Number(localStorage.getItem("nova_font")||19);let favs=JSON.parse(localStorage.getItem("nova_favs")||"[]");
const el=id=>document.getElementById(id),key=()=>names[book]+":"+ch;
function renderBooks(filter=""){el("books").innerHTML="";names.forEach((n,i)=>{if(!n.toLowerCase().includes(filter.toLowerCase()))return;let b=document.createElement("button");b.textContent=n;b.onclick=()=>{book=i;ch=1;render()};el("books").append(b)})}
function render(){ch=Math.max(1,Math.min(ch,counts[book]));localStorage.setItem("nova_book",book);localStorage.setItem("nova_ch",ch);el("heading").textContent=names[book]+" "+ch;el("chapter").innerHTML=Array.from({length:counts[book]},(_,i)=>'<option value="'+(i+1)+'">Capítulo '+(i+1)+'</option>').join("");el("chapter").value=ch;let v=demo[key()];el("verses").innerHTML=v?v.map((s,i)=>'<p><small>'+(i+1)+'</small> '+s+'</p>').join(""):'<p class="muted">Texto ainda não importado para este capítulo. Integre uma tradução bíblica autorizada para ler o conteúdo completo.</p>';el("verses").style.fontSize=size+"px";el("notes").value=localStorage.getItem("nova_note_"+key())||"";el("fav").textContent=favs.includes(key())?"★ Favorito":"☆ Favorito";el("favorites").innerHTML="";favs.forEach(k=>{let b=document.createElement("button");b.textContent=k;b.onclick=()=>{book=names.indexOf(k.split(":")[0]);ch=Number(k.split(":")[1]);render()};el("favorites").append(b)})}
el("chapter").onchange=e=>{ch=Number(e.target.value);render()};el("prev").onclick=()=>{if(ch>1)ch--;else if(book>0){book--;ch=counts[book]}render()};el("next").onclick=()=>{if(ch<counts[book])ch++;else if(book<65){book++;ch=1}render()};el("smaller").onclick=()=>{size=Math.max(14,size-2);localStorage.setItem("nova_font",size);render()};el("larger").onclick=()=>{size=Math.min(32,size+2);localStorage.setItem("nova_font",size);render()};el("notes").oninput=e=>localStorage.setItem("nova_note_"+key(),e.target.value);el("fav").onclick=()=>{favs=favs.includes(key())?favs.filter(x=>x!==key()):[...favs,key()];localStorage.setItem("nova_favs",JSON.stringify(favs));render()};el("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("nova_dark",document.body.classList.contains("dark")?"1":"0")};if(localStorage.getItem("nova_dark")==="1")document.body.classList.add("dark");el("search").oninput=e=>{let q=e.target.value.trim().toLowerCase();renderBooks(q);el("results").innerHTML="";if(!q)return;Object.entries(demo).forEach(([k,v])=>{if(v.some(s=>s.toLowerCase().includes(q))){let b=document.createElement("button");b.textContent="Trecho em "+k;b.onclick=()=>{book=names.indexOf(k.split(":")[0]);ch=Number(k.split(":")[1]);render()};el("results").append(b)}})};renderBooks();render();
</script><script src="importer.js"></script><script src="cordeirinho.js?v=1"></script><script src="v5.js?v=5.0"></script></body></html>
