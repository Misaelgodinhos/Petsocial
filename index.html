<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="PETGO: agropecuárias, pet shops e delivery local"><title>PETGO | Tudo para seus animais</title><link rel="stylesheet" href="style.css?v=petgo-1-0-5"></head><body>
<header class="header"><div class="head-inner"><a class="brand" href="#inicio"><span class="logo">🐾</span>PET<span>GO</span></a><div class="header-actions"><button class="icon-button" id="focusSearch" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button class="cart icon-button" id="cartButton" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24"><path d="M2 3h3l3 13h11l3-10H6M9 21h.01M19 21h.01"/></svg><b id="cartCount">0</b></button><button class="icon-button" id="menuToggle" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div></div><div class="menu-panel" id="menuPanel" hidden><button id="merchantLink">Central do lojista</button><a href="#lojas">Agropecuárias</a><a href="#produtos">Produtos</a></div></header>
<main class="container"><section class="hero" id="inicio"><div class="hero-copy"><span class="eyebrow">AGROPECUÁRIAS E PET SHOPS</span><h1>Tudo para seus animais,<br><em>perto de você.</em></h1></div><div class="hero-art" aria-hidden="true"><img class="hero-dog" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600&q=85" alt=""><img class="hero-cat" src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=400&q=85" alt=""></div></section>
<section class="search-area"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="query" placeholder="Buscar rações, acessórios, produtos..." aria-label="Pesquisar lojas e produtos"><button id="searchBtn" aria-label="Buscar">Buscar</button></div><div class="city-row"><span>📍</span><label for="city" class="sr-only">Sua cidade</label><input id="city" placeholder="Sua cidade" value="Salto de Pirapora"><span class="state-label">- SP</span><button id="setCity" aria-label="Aplicar cidade">⌄</button></div><span id="cityLabel" class="sr-only">Sua região</span></section>
<nav class="categories" id="categories" aria-label="Categorias"><button data-cat="Todos" class="active"><span>▦</span>Todos</button><button data-cat="Rações"><span>🐶</span>Cães</button><button data-cat="Higiene"><span>🐱</span>Gatos</button><button data-cat="Acessórios"><span>🐔</span>Aves</button><button data-cat="Agro"><span>🌱</span>Agro</button><button data-cat="Serviços"><span>•••</span>Mais</button></nav>
<section class="section" id="lojas"><div class="section-title"><h2>Agropecuárias próximas</h2><a href="#storeGrid" class="see-all">Ver todas ›</a></div><div class="store-grid" id="storeGrid"></div><span class="sr-only" id="storeCount"></span></section><section class="section" id="produtos"><div class="section-title"><h2>Produtos disponíveis</h2><span class="muted" id="productCount"></span></div><div class="product-grid" id="productGrid"></div></section></main>
<footer>© PETGO 1.0 · Cada loja realiza suas próprias entregas · <button id="adminFooter">Central do lojista</button></footer>
<nav class="bottom-nav" aria-label="Navegação"><a class="active" href="#inicio"><span>⌂</span>Início</a><a href="#categories"><span>▦</span>Categorias</a><button id="bottomCart" class="bottom-cart"><span>🛒</span>Carrinho</button><a href="#lojas"><span>▤</span>Lojas</a><button id="bottomProfile"><span>♙</span>Perfil</button></nav>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="x" id="closeModal" aria-label="Fechar">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=petgo-1-0-5" defer></script><script>document.getElementById('focusSearch').onclick=()=>document.getElementById('query').focus();document.getElementById('menuToggle').onclick=()=>{const m=document.getElementById('menuPanel');m.hidden=!m.hidden};document.getElementById('bottomCart').onclick=()=>document.getElementById('cartButton').click();document.getElementById('bottomProfile').onclick=()=>document.getElementById('merchantLink').click();document.getElementById('merchantLink').addEventListener('click',()=>document.getElementById('menuPanel').hidden=true);</script></body></html>
