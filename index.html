<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="PETGO: agropecuárias, pet shops e delivery local"><title>PETGO | Tudo para seus animais</title><link rel="stylesheet" href="style.css?v=petgo-1-0-3"><style>html{overflow-x:hidden}body{margin:0;overflow-x:hidden}.header-actions{display:flex;align-items:center;gap:8px}.icon-button{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;flex:none}.icon-button svg,.search svg{display:block;width:23px!important;height:23px!important;min-width:23px;min-height:23px;max-width:23px;max-height:23px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.search{display:flex;align-items:center;min-width:0}.search input{min-width:0;flex:1;width:0}.search button{flex:none}.city-row{display:flex;align-items:center;flex-wrap:nowrap;min-width:0}.city-row input{min-width:0;flex:1;width:0}.city-row button{flex:none}.hero-art span{display:inline-block}.menu-panel[hidden]{display:none}@media(max-width:650px){.head-inner{display:flex;justify-content:space-between}.brand{white-space:nowrap;flex:none}.header-actions{margin-left:auto;flex:none}.search{min-height:58px!important;padding:9px 12px!important}.search svg{width:21px!important;height:21px!important;min-width:21px;min-height:21px}.search button{padding:10px 11px!important}.city-row{min-height:56px!important;padding:9px 12px!important}.city-row input{font-size:14px}.state-label{font-size:13px}.city-row button{font-size:22px}.hero-art{pointer-events:none}}</style></head><body>
<header class="header"><div class="head-inner"><a class="brand" href="#inicio"><span class="logo">🐾</span>PET<span>GO</span></a><div class="header-actions"><button class="icon-button" id="focusSearch" aria-label="Pesquisar"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button class="cart icon-button" id="cartButton" aria-label="Abrir carrinho"><svg viewBox="0 0 24 24"><path d="M2 3h3l3 13h11l3-10H6M9 21h.01M19 21h.01"/></svg><b id="cartCount">0</b></button><button class="icon-button" id="menuToggle" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div></div><div class="menu-panel" id="menuPanel" hidden><button id="merchantLink">Central do lojista</button><a href="#lojas">Agropecuárias</a><a href="#produtos">Produtos</a></div></header>
<main class="container"><section class="hero" id="inicio"><div class="hero-copy"><span class="eyebrow">AGROPECUÁRIAS E PET SHOPS</span><h1>Tudo para seus animais,<br><em>perto de você.</em></h1></div><div class="hero-art" aria-hidden="true"><span>🐕</span><span>🐈</span></div></section>
<section class="search-area"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="query" placeholder="Buscar rações, acessórios, produtos..." aria-label="Pesquisar lojas e produtos"><button id="searchBtn" aria-label="Buscar">Buscar</button></div><div class="city-row"><span>📍</span><label for="city" class="sr-only">Sua cidade</label><input id="city" placeholder="Sua cidade" value="Salto de Pirapora"><span class="state-label">- SP</span><button id="setCity" aria-label="Aplicar cidade">⌄</button></div><span id="cityLabel" class="sr-only">Sua região</span></section>
<nav class="categories" id="categories" aria-label="Categorias"><button data-cat="Todos" class="active"><span>▦</span>Todos</button><button data-cat="Rações"><span>🐶</span>Cães / Rações</button><button data-cat="Higiene"><span>🐱</span>Higiene</button><button data-cat="Agro"><span>🌱</span>Agro</button><button data-cat="Acessórios"><span>🦴</span>Acessórios</button><button data-cat="Serviços"><span>•••</span>Serviços</button></nav>
<section class="section" id="lojas"><div class="section-title"><h2>Agropecuárias próximas</h2><a href="#storeGrid" class="see-all">Ver todas ›</a></div><div class="store-grid" id="storeGrid"></div><span class="sr-only" id="storeCount"></span></section><section class="section" id="produtos"><div class="section-title"><h2>Produtos disponíveis</h2><span class="muted" id="productCount"></span></div><div class="product-grid" id="productGrid"></div></section></main>
<footer>© PETGO 1.0 · Cada loja realiza suas próprias entregas · <button id="adminFooter">Central do lojista</button></footer>
<nav class="bottom-nav" aria-label="Navegação"><a class="active" href="#inicio"><span>⌂</span>Início</a><a href="#categories"><span>▦</span>Categorias</a><button id="bottomCart" class="bottom-cart"><span>🛒</span>Carrinho</button><a href="#lojas"><span>▤</span>Lojas</a><button id="bottomProfile"><span>♙</span>Perfil</button></nav>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="x" id="closeModal" aria-label="Fechar">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="app.js?v=petgo-1-0-3" defer></script><script>document.getElementById('focusSearch').onclick=()=>document.getElementById('query').focus();document.getElementById('menuToggle').onclick=()=>{const m=document.getElementById('menuPanel');m.hidden=!m.hidden};document.getElementById('bottomCart').onclick=()=>document.getElementById('cartButton').click();document.getElementById('bottomProfile').onclick=()=>document.getElementById('merchantLink').click();document.getElementById('merchantLink').addEventListener('click',()=>document.getElementById('menuPanel').hidden=true);</script></body></html>
