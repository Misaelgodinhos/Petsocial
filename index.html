<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="PETGO — encontre agropecuárias, produtos para pets e delivery da sua cidade.">
<title>PETGO — tudo para seus animais</title>
<link rel="stylesheet" href="style.css?v=petgo-mobile-1-1">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="svg-defs" aria-hidden="true">
<symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="6.3" cy="6.8" rx="2.1" ry="2.9" transform="rotate(-18 6.3 6.8)"/><ellipse cx="12" cy="4.5" rx="2.1" ry="2.8"/><ellipse cx="17.7" cy="6.8" rx="2.1" ry="2.9" transform="rotate(18 17.7 6.8)"/><ellipse cx="21" cy="12" rx="1.65" ry="2.3" transform="rotate(26 21 12)"/><path d="M6.1 13.5c1.4-2.4 3-4 5.9-4s4.5 1.6 5.9 4l2 3.7a3 3 0 0 1-4.1 4c-2.3-1.2-5.3-1.2-7.6 0a3 3 0 0 1-4.1-4z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.2"/><path d="m16.2 16.2 5 5"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><path d="M2.5 3.2h2.9l2.8 12.1h10.5l2.4-8.8H6.5"/><circle cx="9.1" cy="20" r="1.1"/><circle cx="18.1" cy="20" r="1.1"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-dog" viewBox="0 0 24 24"><path d="M6 7 2 5l.5 7 3.5 2M18 7l4-2-.5 7-3.5 2M7 8c.8-2 2.4-3 5-3s4.2 1 5 3l1 8c0 3-2.3 5-6 5s-6-2-6-5z"/><path d="M9 14h.01M15 14h.01M10 17h4l-2 2z"/></symbol>
<symbol id="i-cat" viewBox="0 0 24 24"><path d="m4 10 1-7 5 4a12 12 0 0 1 4 0l5-4 1 7v6c0 4-3 6-8 6s-8-2-8-6z"/><path d="M8 14h.01M16 14h.01m-4 2v2m-2 0h4M3 16l4 1M21 16l-4 1"/></symbol>
<symbol id="i-bird" viewBox="0 0 24 24"><path d="M4 14c-1-5 2-9 7-9 3 0 5 1 6 4 2 1 4 1 5 3l-5 2c-1 4-4 6-8 6-2 0-4-2-5-6Z"/><path d="M5 12c3 1 5 3 5 7M16 9h.01M10 20v3m4-4v4"/></symbol>
<symbol id="i-leaf" viewBox="0 0 24 24"><path d="M12 22V11m0 7C5 19 3 14 3 7c6 0 9 4 9 9m0-5c0-5 4-8 9-8 0 6-2 10-9 10"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="4" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 1 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><path d="M1.5 5h13v12h-13zm13 4h4l3.5 4v4h-7.5"/><circle cx="5.5" cy="18" r="2"/><circle cx="18.5" cy="18" r="2"/></symbol>
<symbol id="i-store" viewBox="0 0 24 24"><path d="m3 9 2-6h14l2 6v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0zM5 14v7h14v-7M9 21v-6h6v6"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="m2 11 10-8 10 8M5 10v11h14V10M9 21v-8h6v8"/></symbol>
<symbol id="i-bag" viewBox="0 0 24 24"><path d="M4 8h16l1 13H3zm5 1V6a3 3 0 0 1 6 0v3"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-2c0-4 3-6 8-6s8 2 8 6v2z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
</svg>
<header class="header">
<div class="head-inner">
  <a class="brand" href="#inicio" aria-label="Petgo, início"><svg class="brand-paw"><use href="#i-paw"/></svg><span>PET<strong>GO</strong></span></a>
  <div class="header-actions">
    <button class="icon-button" id="focusSearch" aria-label="Pesquisar"><svg class="icon"><use href="#i-search"/></svg></button>
    <button class="icon-button cart" id="cartButton" aria-label="Abrir carrinho"><svg class="icon"><use href="#i-cart"/></svg><b id="cartCount">0</b></button>
    <button class="icon-button" id="menuToggle" aria-label="Abrir menu" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
  </div>
</div>
<div class="menu-panel" id="menuPanel" hidden>
 <button id="merchantLink" type="button">Central do lojista</button><a href="#lojas">Agropecuárias</a><a href="#produtos">Produtos</a>
</div>
</header>
<main class="container">
<section class="hero" id="inicio">
 <div class="hero-copy"><span class="eyebrow">AGROPECUÁRIAS E PET SHOPS</span><h1>Tudo para seus animais,<br><em>perto de você.</em></h1></div>
 <div class="hero-art" aria-hidden="true"><div class="paw-watermark">● ● ●<br> ●</div><img class="hero-dog" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=700&q=85" alt=""><img class="hero-cat" src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=380&q=85" alt=""></div>
</section>
<section class="search-area" aria-label="Busca">
 <div class="search"><svg class="icon"><use href="#i-search"/></svg><input id="query" type="search" placeholder="Buscar rações, acessórios, produtos..." aria-label="Pesquisar lojas e produtos"><button id="searchBtn" type="button" aria-label="Buscar">Buscar</button></div>
 <div class="city-row"><svg class="icon pin"><use href="#i-pin"/></svg><label class="sr-only" for="city">Sua cidade</label><input id="city" value="Salto de Pirapora" placeholder="Sua cidade" aria-label="Cidade da pesquisa"><span class="state-label">- SP</span><button id="setCity" title="Aplicar cidade" aria-label="Aplicar cidade"><svg class="icon"><use href="#i-down"/></svg></button></div><span class="sr-only" id="cityLabel">Sua região</span>
</section>
<nav class="categories" id="categories" aria-label="Categorias">
 <button data-cat="Todos" class="active"><svg class="icon"><use href="#i-grid"/></svg>Todos</button>
 <button data-cat="Cães"><svg class="icon"><use href="#i-dog"/></svg>Cães</button>
 <button data-cat="Gatos"><svg class="icon"><use href="#i-cat"/></svg>Gatos</button>
 <button data-cat="Aves"><svg class="icon"><use href="#i-bird"/></svg>Aves</button>
 <button data-cat="Agro"><svg class="icon"><use href="#i-leaf"/></svg>Agro</button>
 <button data-cat="Mais"><svg class="icon"><use href="#i-more"/></svg>Mais</button>
</nav>
<section class="section" id="lojas">
 <div class="section-title"><h2>Agropecuárias próximas</h2><a href="#storeGrid" class="see-all">Ver todas <span>›</span></a></div>
 <p class="demo-caption">Lojas ilustrativas para demonstrar a plataforma.</p>
 <div class="store-grid" id="storeGrid"></div><span class="sr-only" id="storeCount"></span>
</section>
<section class="section" id="produtos">
 <div class="section-title"><h2>Produtos disponíveis</h2><span class="muted" id="productCount"></span></div><div class="product-grid" id="productGrid"></div>
</section>
</main>
<footer>© PETGO 1.0 · Pedidos demonstrativos · <button id="adminFooter">Central do lojista</button></footer>
<nav class="bottom-nav" aria-label="Navegação">
<a class="active" href="#inicio"><svg class="icon"><use href="#i-home"/></svg><span>Início</span></a>
<a href="#categories"><svg class="icon"><use href="#i-grid"/></svg><span>Categorias</span></a>
<button id="bottomCart" class="bottom-cart" aria-label="Carrinho"><span class="cart-bubble"><svg class="icon"><use href="#i-cart"/></svg></span><span>Carrinho</span></button>
<a href="#lojas"><svg class="icon"><use href="#i-bag"/></svg><span>Lojas</span></a>
<button id="bottomProfile" aria-label="Perfil"><svg class="icon"><use href="#i-user"/></svg><span>Perfil</span></button>
</nav>
<dialog id="modal"><div class="dialog-head"><h2 id="modalTitle"></h2><button class="x" id="closeModal" aria-label="Fechar">×</button></div><div id="modalBody"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=petgo-mobile-1-1" defer></script>
<script>
document.getElementById('focusSearch').addEventListener('click',()=>document.getElementById('query').focus());
document.getElementById('menuToggle').addEventListener('click',()=>{const menu=document.getElementById('menuPanel');menu.hidden=!menu.hidden;document.getElementById('menuToggle').setAttribute('aria-expanded',String(!menu.hidden));});
document.getElementById('bottomCart').addEventListener('click',()=>document.getElementById('cartButton').click());
document.getElementById('bottomProfile').addEventListener('click',()=>{const message='O perfil do cliente estará disponível após a integração com autenticação.';document.getElementById('modalTitle').textContent='Meu perfil';document.getElementById('modalBody').textContent=message;document.getElementById('modal').showModal()});
document.getElementById('merchantLink').addEventListener('click',()=>{document.getElementById('menuPanel').hidden=true;document.getElementById('menuToggle').setAttribute('aria-expanded','false')});
document.querySelectorAll('.menu-panel a').forEach(a=>a.addEventListener('click',()=>document.getElementById('menuPanel').hidden=true));
</script>
</body></html>
