<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><title>NOVA Reels</title><link rel="stylesheet" href="styles.css?v=1"></head><body><div id="app"><header class="topbar"><button class="logo" id="logo">◈ NOVA <span>reels</span></button><div class="feed-tabs"><button id="followingTab">Seguindo</button><button id="forYouTab" class="selected">Para você</button></div><button id="searchBtn" aria-label="Pesquisar">⌕</button></header><main><section class="feed" id="feed" aria-label="Feed de vídeos"></section><section class="page" id="explorePage" hidden><h1>Explorar</h1><input id="searchInput" placeholder="Buscar vídeos e criadores"><div id="exploreResults" class="explore-grid"></div></section><section class="page" id="profilePage" hidden><h1>Meu perfil</h1><p>@voce · Criador NOVA</p><div class="stats"><span><strong id="videoCount">0</strong> vídeos</span><span><strong id="likeCount">0</strong> curtidas</span><span><strong id="followCount">0</strong> seguindo</span></div><button id="profileUpload" class="primary">+ Publicar vídeo</button><h2>Minhas publicações</h2><div id="myVideos" class="explore-grid"></div></section></main><nav class="bottom-nav"><button data-page="feed" class="active">⌂<small>Início</small></button><button data-page="explore">⌕<small>Explorar</small></button><button id="newPost" class="new-post" aria-label="Publicar">＋</button><button data-page="profile">♙<small>Perfil</small></button></nav></div><dialog id="uploadDialog"><form id="uploadForm" class="dialog-inner"><div class="dialog-head"><h2>Publicar vídeo</h2><button type="button" id="closeUpload">✕</button></div><p>Vídeos ficam salvos apenas neste navegador, não são publicados para outras pessoas.</p><label>Vídeo MP4 ou WebM, até 80 MB<input id="videoFile" type="file" accept="video/mp4,video/webm,video/ogg" required></label><label>Legenda<textarea id="caption" maxlength="300" rows="3" required></textarea></label><label>Nome de criador<input id="creator" maxlength="32" value="Você" required></label><p id="uploadStatus" role="status"></p><button type="submit" class="primary" id="publishBtn">Salvar vídeo</button></form></dialog><dialog id="commentsDialog"><div class="dialog-inner"><div class="dialog-head"><h2>Comentários</h2><button id="closeComments">✕</button></div><div id="commentsList"></div><form id="commentForm"><input id="commentInput" maxlength="280" placeholder="Escreva um comentário" required><button>Enviar</button></form></div></dialog><script defer src="app.js?v=1"></script></body></html>
